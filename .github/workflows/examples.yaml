# Runs the documentation examples through policyctl's test harness, the same
# .ptests.yaml suites the community policies repository uses. It only fires
# when something under docs/examples/ changes: the examples are self-contained
# (policy + the attestation it reads) so nothing else in the tree affects them.
name: examples

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "docs/examples/**"
      - ".github/workflows/examples.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  policy-tests:
    name: Example Policy Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install policyctl
        uses: carabiner-dev/actions/install/policyctl@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0
        with:
          # Pin the version explicitly: the action's own default at this ref
          # is v0.1.0, which predates the policy parser these examples need
          # and fails them all with "unable to parse a policy, group or
          # policySet from data".
          version: v0.1.2

      - name: Run example policy tests
        shell: bash
        run: |
          set -euo pipefail

          # policyctl reads one .ptests.yaml per directory, so collect the
          # suites and run each in turn. Discovering them instead of listing
          # them means a new example directory is picked up automatically.
          mapfile -t suites < <(find docs/examples -name .ptests.yaml | sort)

          # A missing or misnamed suite makes policyctl exit 0, so guard
          # against the whole job passing without running anything.
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::no .ptests.yaml suites found under docs/examples/"
            exit 1
          fi

          status=0
          for suite in "${suites[@]}"; do
            dir="$(dirname "${suite}")"
            echo "::group::${dir}"
            policyctl test -v "${dir}" || status=1
            echo "::endgroup::"
          done

          exit "${status}"
