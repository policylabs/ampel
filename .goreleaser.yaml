project_name: ampel
version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy
    - /bin/bash -c 'if [ -n "$(git --no-pager diff --exit-code go.mod go.sum)" ]; then exit 1; fi'

gomod:
  proxy: true

builds:
  - id: ampel
    no_unique_dist_dir: true
    binary: ampel-{{ .Tag }}-{{ .Os }}-{{ .Arch }}
    main: ./cmd/ampel
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      # 32-bit arm is built for linux only: darwin dropped it and there is no
      # windows/arm target worth shipping.
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    flags:
      - -trimpath

archives:
  - formats: binary
    name_template: ampel-{{ .Tag }}-{{ .Os }}-{{ .Arch }}
    allow_different_binary_count: true
checksum:
  disable: true

release:
  github:
    owner: policylabs
    name: ampel
  prerelease: auto

changelog:
  disable: true
